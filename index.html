<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rainy Drive 🎧</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="scene">
    <section class="music-player">
      <div class="screen-top">
        <span>7:48</span>
        <span>♪ MUSIC</span>
        <span>24°C</span>
      </div>

      <div class="player">
        <div class="album-art">
          <span>☁️</span>
          <strong>Rainy<br>Drive</strong>
          <small>bollywood playlist</small>
        </div>

        <div class="song-info">
          <p class="eyebrow">NOW PLAYING</p>
          <h1 id="title">Choose a song ♡</h1>
          <p id="artist">Your playlist is waiting...</p>

          <input id="progress" type="range" min="0" max="100" value="0">

          <div class="times">
            <span id="currentTime">0:00</span>
            <span id="duration">0:00</span>
          </div>

          <div class="controls">
            <button id="shuffle">⤨</button>
            <button id="back10">↶10</button>
            <button id="prev">⏮</button>
            <button id="play" class="play">▶</button>
            <button id="next">⏭</button>
            <button id="forward10">10↷</button>
            <button id="repeat">↻</button>
          </div>

          <div class="volume-row">
            <span>🔈</span>
            <input id="volume" type="range" min="0" max="1" step="0.01" value="0.8">
            <span>🔊</span>
          </div>
        </div>
      </div>

      <div class="playlist-head">
        <div>
          <p class="eyebrow">BOLLYWOOD ROAD-TRIP</p>
          <h2>rainy drive ☔</h2>
        </div>
      </div>

      <div id="playlist" class="playlist"></div>
    </section>
  </main>

  <audio id="audio"></audio>
  <script src="script.js"></script>
</body>
</html>
